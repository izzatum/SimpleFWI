name: Documentation site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/docs.txt
      - name: Install static-site dependencies
        run: python -m pip install -r requirements/docs.txt
      - name: Build crawlable HTML
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: python -m mkdocs build --strict
      - name: Check pages, links, metadata and sitemap
        run: python scripts/check_docs.py --site-dir site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages_status:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether Pages is configured for Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "SimpleFWI-docs-workflow",
              },
          )
          enabled = False
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  pages = json.load(response)
              enabled = pages.get("build_type") == "workflow"
              if not enabled:
                  print("::notice::Pages does not use Actions. Select Settings > Pages > Source > GitHub Actions, then rerun this workflow.")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise RuntimeError(f"Pages configuration check failed: HTTP {error.code}") from None
              print("::notice::Pages is not configured (HTTP 404). Select Settings > Pages > Source > GitHub Actions, then rerun this workflow. No site was published.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          PY

  deploy:
    if: needs.pages_status.outputs.enabled == 'true'
    needs: [build, pages_status]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
